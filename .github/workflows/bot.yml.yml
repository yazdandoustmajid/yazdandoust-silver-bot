name: Run Silver Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - ".github/workflows/bot.yml"
      - "start_trades.webp"
      - "Start_Traders(2).webp"
      - "Start_Traders.webp"
      - "end_trades.webp"
      - "End_Traders(2).webp"
      - "End_Traders.webp"
      - "board_only_preview.png"
  workflow_dispatch:
  schedule:
    # GitHub Actions supports a minimum 5-minute schedule.
    # The bot itself polls Taghizadegan every 10 seconds while running.
    - cron: "*/5 * * * *"
      timezone: "Asia/Tehran"

permissions:
  contents: write

concurrency:
  group: silver-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          SOURCE_CHANNEL: tghsilver
          WEBSITE_URL: https://taghizadegan.com
          MASHHAD_SOURCE_CHANNEL: taybadonline

          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: |
          python bot.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update bot state"
            git push
          fi
