name: Run Silver Price Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot_price_final.py"
      - ".github/workflows/price-bot.yml"
      - "start_trades.png"
      - "end_trades.png"
      - "board_only_preview.png"
      - "requirements.txt"

  workflow_dispatch:

  schedule:
    # GitHub Actions scheduled workflows: every 5 minutes
    - cron: "*/5 * * * *"
      timezone: "Asia/Tehran"

permissions:
  contents: write

concurrency:
  group: silver-price-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fas
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          ADMIN_TELEGRAM_USERNAME: ${{ secrets.ADMIN_TELEGRAM_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}

          # Each bot keeps its own state and Telethon session.
          STATE_FILE: price_state.json
          TELEGRAM_SESSION_NAME: price_bot

          SOURCE_CHANNEL: tghsilver
          WEBSITE_URL: https://taghizadegan.com
          MASHHAD_SOURCE_CHANNEL: taybadonline

        run: |
          python bot_price_final.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add price_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update price bot state"

          attempt=1
          max_attempts=5

          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push price_state.json after $attempt attempts."
              exit 1
            fi

            echo "Push failed (attempt $attempt/$max_attempts) — rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main

            attempt=$((attempt + 1))
            sleep 3
          done

          echo "State pushed successfully."
