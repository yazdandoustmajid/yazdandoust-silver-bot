name: Run Silver Price Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot_sales_final.py"
      - ".github/workflows/price-bot.yml"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: silver-price-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fas
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Run price bot
        env:
          # THIS IS REQUIRED. Without it bot_sales_final.py defaults to
          # price anyway, but set it explicitly so intent is unambiguous
          # and this workflow can never silently start behaving like the
          # sales bot if the script's default ever changes.
          BOT_ROLE: price

          # Price bot uses its own token, separate from the sales bot.
          PRICE_BOT_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}

          # Telegram API credentials (Telethon) required by the price bot.
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}

          # Required for AI-written news/analysis posts.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Optional Rubika mirror.
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}

          SOURCE_CHANNEL: tghsilver
          WEBSITE_URL: https://taghizadegan.com
          MASHHAD_SOURCE_CHANNEL: taybadonline

        run: |
          # Verify required GitHub Secrets are actually available.
          test -n "$PRICE_BOT_TOKEN" || { echo "::error::GitHub Secret PRICE_BOT_TOKEN is empty or unavailable."; exit 1; }
          test -n "$API_ID" || { echo "::error::GitHub Secret API_ID is empty or unavailable."; exit 1; }
          test -n "$API_HASH" || { echo "::error::GitHub Secret API_HASH is empty or unavailable."; exit 1; }
          test -n "$TARGET_CHANNEL" || { echo "::error::GitHub Secret TARGET_CHANNEL is empty or unavailable."; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::GitHub Secret OPENAI_API_KEY is empty or unavailable."; exit 1; }
          test -f board_only_preview.png || { echo "::error::board_only_preview.png missing from repo root — price bot will refuse to start without it."; exit 1; }

          python bot_sales_final.py

      - name: Save state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f state.json ]; then
            echo "state.json does not exist. Nothing to save."
            exit 0
          fi

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update price bot state"

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "State push attempt $attempt/$max_attempts..."

            if git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Remote main changed. Fetching latest main..."
            git fetch origin main
            git rebase -X theirs origin/main
            sleep 2
          done

          echo "::error::Could not push state.json after $max_attempts attempts."
          exit 1
