name: Run Silver Bot

on:
  workflow_dispatch:
  schedule:
    # Run every 15 minutes using Tehran time.
    - cron: "*/15 * * * *"
      timezone: "Asia/Tehran"

permissions:
  contents: write

concurrency:
  group: silver-price-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run price bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PRICE_BOT_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          ADMIN_TELEGRAM_USERNAME: ${{ secrets.ADMIN_TELEGRAM_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          PRICE_BOT_USERNAME: Yazdandoustpricebot
          TELEGRAM_SESSION_NAME: price_bot
        run: |
          python bot.py

      # The price bot stores daily/news/price state in state.json.
      # GitHub runners are temporary, so persist the updated state back
      # to main after every successful run.
      - name: Save state safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f state.json ]; then
            echo "state.json does not exist. Nothing to save."
            exit 0
          fi

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update price bot state"

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "State push attempt $attempt/$max_attempts..."

            if git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi

            echo "Remote main changed. Fetching latest main..."
            git fetch origin main

            # Keep this run's generated state if state.json conflicts.
            git rebase -X theirs origin/main

            sleep 2
          done

          echo "::error::Could not push state.json after $max_attempts attempts."
          exit 1
