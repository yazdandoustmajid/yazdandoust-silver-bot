name: Run Silver Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - ".github/workflows/bot.yml"
      - "start_trades.png"
      - "end_trades.png"
      - "board_only_preview.png"

  workflow_dispatch:

  schedule:
    # بررسی قیمت و خبرها هر ۵ دقیقه
    - cron: "*/5 * * * *"
      timezone: "Asia/Tehran"

permissions:
  contents: write

concurrency:
  group: silver-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fas
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      # ============================================================
      # RUN BOT
      # ============================================================

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          ADMIN_TELEGRAM_USERNAME: ${{ secrets.ADMIN_TELEGRAM_USERNAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}

          SOURCE_CHANNEL: tghsilver
          WEBSITE_URL: https://taghizadegan.com
          MASHHAD_SOURCE_CHANNEL: taybadonline

        run: |
          python bot.py

      # ============================================================
      # SAVE STATE
      # ============================================================
      # Runs can queue up back-to-back (concurrency.cancel-in-progress
      # is false), so by the time this step runs, a previous queued run
      # may have already pushed a newer state.json. A plain "git push"
      # would then fail (non-fast-forward) and be silently lost, causing
      # the bot to "forget" a price/news update it already sent — which
      # is why prices looked stale and news got re-posted a few minutes
      # later. We rebase onto the latest remote state before pushing,
      # and retry a few times in case of a race.

      - name: Save state
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update bot state"

          attempt=1
          max_attempts=5

          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push state.json after $attempt attempts."
              exit 1
            fi

            echo "Push failed (attempt $attempt/$max_attempts) — rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main

            attempt=$((attempt + 1))
            sleep 3
          done

          echo "State pushed successfully."
