name: Run Silver Bot

on:

  workflow_dispatch:

  schedule:

    # هر 15 دقیقه
    - cron: "*/15 * * * *"
      timezone: "Asia/Tehran"

    # 08:00 پیام صبحگاهی
    - cron: "0 8 * * *"
      timezone: "Asia/Tehran"

    # 10:30 شروع معاملات
    - cron: "30 10 * * *"
      timezone: "Asia/Tehran"

    # 11:00 گزارش طلا و سکه مشهد
    - cron: "0 11 * * *"
      timezone: "Asia/Tehran"

    # 15:00 گزارش طلا و سکه مشهد
    - cron: "0 15 * * *"
      timezone: "Asia/Tehran"

    # 18:00 گزارش طلا و سکه مشهد
    - cron: "0 18 * * *"
      timezone: "Asia/Tehran"

    # 21:00 پایان معاملات
    - cron: "0 21 * * *"
      timezone: "Asia/Tehran"

    # 21:15 گزارش 24 ساعته
    - cron: "15 21 * * *"
      timezone: "Asia/Tehran"


permissions:

  contents: write


concurrency:

  group: silver-bot

  cancel-in-progress: false


jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          persist-credentials: true


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests beautifulsoup4 pillow telethon


      - name: Run bot

        env:

          API_ID: ${{ secrets.API_ID }}

          API_HASH: ${{ secrets.API_HASH }}

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}

          SOURCE_CHANNEL: tghsilver

          WEBSITE_URL: https://taghizadegan.com

          MASHHAD_SOURCE_CHANNEL: taybadonline

        run: |

          python bot.py


      - name: Save state

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then

            echo "No state changes."

          else

            git commit -m "Update bot state"

            git push

          fi
