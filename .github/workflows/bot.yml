name: Run Silver Bot
permissions:
  contents: write
concurrency:
  group: silver-bot
  cancel-in-progress: false
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Run bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
        RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        SOURCE_CHANNEL: tghsilver
        WEBSITE_URL: https://taghizadegan.com
        MASHHAD_SOURCE_CHANNEL: taybadonline
        PAYMENT_CARD_NUMBER: ${{ secrets.PAYMENT_CARD_NUMBER }}
        PAYMENT_CARD_NAME: ${{ secrets.PAYMENT_CARD_NAME }}
        PAYMENT_IBAN: ${{ secrets.PAYMENT_IBAN }}
        PAYMENT_IBAN_NAME: ${{ secrets.PAYMENT_IBAN_NAME }}
        PAYMENT_URL: ${{ secrets.PAYMENT_URL }}
        ORDER_PRICE_LOCK_MINUTES: ${{ secrets.ORDER_PRICE_LOCK_MINUTES }}
        DAILY_ORDER_LIMIT_GRAMS: ${{ secrets.DAILY_ORDER_LIMIT_GRAMS }}
        SHIPPING_CARRIER: ${{ secrets.SHIPPING_CARRIER }}
      run: 'python bot.py

        '
    - name: Save state
      run: "\ngit config user.name \"github-actions[bot]\"\ngit config user.email\
        \ \"41898282+github-actions[bot]@users.noreply.github.com\"\n\ngit add state.json\n\
        \nif git diff --cached --quiet; then\n  echo \"No state changes.\"\n  exit\
        \ 0\nfi\n\ngit commit -m \"Update bot state\"\n\nattempt=1\nmax_attempts=5\n\
        \nuntil git push; do\n  if [ \"$attempt\" -ge \"$max_attempts\" ]; then\n\
        \    echo \"::error::Failed to push state.json after $attempt attempts.\"\n\
        \    exit 1\n  fi\n\n  echo \"Push failed (attempt $attempt/$max_attempts)\
        \ — rebasing onto latest origin/main and retrying...\"\n  git fetch origin\
        \ main\n  git rebase origin/main\n\n  attempt=$((attempt + 1))\n  sleep 3\n\
        done\n\necho \"State pushed successfully.\"\n"
'on':
  push:
    branches:
    - main
    paths:
    - bot.py
    - .github/workflows/bot.yml
    - start_trades.png
    - end_trades.png
    - board_only_preview.png
  workflow_dispatch: null
  schedule:
  - cron: '*/5 * * * *'
    timezone: Asia/Tehran
